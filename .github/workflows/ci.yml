name: 🧪 KrioMetrics CI - Tests & Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: ⚙️ Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: 🧪 Run unit tests with coverage
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: 📊 Upload coverage report
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          flags: unittests
          name: kriometrics-coverage
          fail_ci_if_error: false

  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: 🔍 Check code formatting with Black
        run: |
          black --check --diff src/ tests/ || echo "Formatting issues found (non-blocking)"

      - name: 🔎 Lint with flake8
        run: |
          flake8 src/ tests/ \
            --max-line-length=100 \
            --ignore=E402,W503,E501 \
            --count --statistics || echo "Lint issues found (non-blocking)"

  etl-pipeline:
    name: ETL Pipeline Integration Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run ETL Pipeline
        run: |
          python main.py
          echo "✅ ETL pipeline completed successfully"

      - name: 📁 Verify output files
        run: |
          echo "Checking generated CSV files..."
          ls -la data/processed/*.csv || echo "⚠️ No CSV files found"
          echo "Checking SQLite database..."
          ls -la data/processed/*.db || echo "⚠️ No DB file found"
          echo "Checking EDA report..."
          ls -la data/processed/*.md || echo "⚠️ No Markdown report found"

      - name: 📤 Upload ETL artifacts
        uses: actions/upload-artifact@v4
        with:
          name: etl-outputs-${{ github.sha }}
          path: data/processed/
          retention-days: 7
