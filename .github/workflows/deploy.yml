name: 🚀 Deploy to Streamlit Community Cloud

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'dashboard/**'
      - 'data/**'
      - 'streamlit_app.py'
      - 'requirements.txt'

  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual trigger'

jobs:
  validate-before-deploy:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run critical tests before deploy
        run: |
          python -m pytest tests/ -v --tb=short -x

      - name: 🔄 Verify ETL pipeline runs clean
        run: |
          python run_etl.py --validate --report --sustainability
          echo "✅ ETL pipeline verified - safe to deploy"

      - name: 📋 Validate Streamlit app syntax
        run: |
          python -c "
          import ast, sys
          with open('streamlit_app.py', 'r') as f:
              source = f.read()
          try:
              ast.parse(source)
              print('✅ streamlit_app.py syntax is valid')
          except SyntaxError as e:
              print(f'❌ Syntax error: {e}')
              sys.exit(1)
          "

      - name: 📊 Generate pre-deploy report
        run: |
          echo "## Pre-deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ✅ All validations passed" >> $GITHUB_STEP_SUMMARY
          python -c "
          import os
          files = os.listdir('data/processed') if os.path.exists('data/processed') else []
          print(f'Generated files: {files}')
          " >> $GITHUB_STEP_SUMMARY || true

  notify-deploy:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: validate-before-deploy

    steps:
      - name: 📣 Notify deployment success
        run: |
          echo "## ✅ KrioMetrics Dashboard Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Dashboard URL**: https://kriometrics.streamlit.app" >> $GITHUB_STEP_SUMMARY
          echo "**Deploy time**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The KrioMetrics Refrigerant Gas Dashboard has been validated and is ready for Streamlit Cloud." >> $GITHUB_STEP_SUMMARY
